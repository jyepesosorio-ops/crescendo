<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <defs>
    <style>
      .mono { font-family: "DM Mono", Consolas, monospace; letter-spacing: .09em; }
      .sans { font-family: Inter, Arial, sans-serif; }
      .hero { font-family: Inter, Arial, sans-serif; font-weight: 500; letter-spacing: -0.07em; }
      .dotline { fill: none; stroke: #f2f2ee; stroke-linecap: round; stroke-dasharray: 0 23; opacity: .52; }
      .soft { opacity: .22; }
      .blue { fill: #2f6bff; }
    </style>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- navigation -->
  <g fill="#f2f2ee">
    <text x="64" y="54" class="sans" font-size="16" font-weight="800">CRESCENDO</text>
    <text x="64" y="74" class="sans" font-size="16" font-weight="800">LABS</text>
    <g class="mono" font-size="11" opacity=".72">
      <text x="1370" y="54">SERVICES</text>
      <text x="1495" y="54">PROOF</text>
      <text x="1600" y="54">PROCESS</text>
      <text x="1726" y="54">CONTACT</text>
    </g>
  </g>

  <!-- scattered operational noise -->
  <g fill="#f2f2ee" opacity=".34">
    <circle cx="565" cy="310" r="2.1"/><circle cx="610" cy="390" r="3.4"/><circle cx="685" cy="258" r="1.8"/>
    <circle cx="720" cy="476" r="2.8"/><circle cx="792" cy="326" r="1.6"/><circle cx="830" cy="568" r="3.1"/>
    <circle cx="612" cy="620" r="1.8"/><circle cx="742" cy="690" r="2.2"/><circle cx="895" cy="258" r="2.6"/>
    <circle cx="920" cy="720" r="1.9"/><circle cx="540" cy="520" r="1.7"/><circle cx="802" cy="230" r="2.1"/>
    <circle cx="640" cy="735" r="1.8"/><circle cx="970" cy="338" r="2.4"/><circle cx="1010" cy="645" r="1.8"/>
    <circle cx="690" cy="575" r="2.5"/><circle cx="878" cy="438" r="3.8"/><circle cx="760" cy="392" r="1.5"/>
    <circle cx="570" cy="690" r="1.5"/><circle cx="990" cy="540" r="2.4"/><circle cx="935" cy="470" r="1.3"/>
  </g>

  <!-- transformation field: raw points pulled into a controlled funnel -->
  <g transform="translate(1015 505)">
    <path class="dotline" stroke-width="7" d="M-390,-260 C-210,-360 80,-340 275,-110 C420,60 345,190 125,228 C-122,270 -345,140 -390,-260"/>
    <path class="dotline" stroke-width="6.5" d="M-355,-218 C-165,-315 90,-290 265,-92 C385,44 320,165 110,198 C-112,232 -312,115 -355,-218"/>
    <path class="dotline" stroke-width="6" d="M-318,-178 C-142,-260 84,-245 238,-76 C340,34 288,138 94,168 C-98,198 -270,92 -318,-178"/>
    <path class="dotline" stroke-width="5.5" d="M-278,-140 C-118,-210 78,-200 210,-60 C292,28 246,112 78,136 C-78,158 -230,72 -278,-140"/>
    <path class="dotline" stroke-width="5" d="M-235,-105 C-96,-164 70,-158 180,-46 C246,22 205,88 62,108 C-62,124 -188,56 -235,-105"/>
    <path class="dotline" stroke-width="4.5" d="M-190,-74 C-72,-118 58,-116 146,-34 C196,16 160,64 48,78 C-46,90 -145,39 -190,-74"/>
    <path class="dotline" stroke-width="4" d="M-145,-48 C-50,-78 45,-80 112,-24 C148,10 118,42 34,52 C-30,58 -104,27 -145,-48"/>
    <path class="dotline" stroke-width="3.5" opacity=".38" d="M-95,-26 C-28,-46 35,-48 76,-14 C96,8 72,25 22,30 C-14,34 -64,15 -95,-26"/>
  </g>

  <!-- clean output stream -->
  <g fill="#f2f2ee" opacity=".52">
    <circle cx="1275" cy="505" r="2.4"/><circle cx="1318" cy="490" r="2"/><circle cx="1362" cy="477" r="1.9"/>
    <circle cx="1406" cy="468" r="2.2"/><circle cx="1450" cy="462" r="1.8"/><circle cx="1496" cy="459" r="2"/>
    <circle cx="1542" cy="461" r="1.7"/><circle cx="1588" cy="468" r="2.1"/><circle cx="1634" cy="480" r="1.8"/>
    <circle cx="1300" cy="538" r="1.7"/><circle cx="1345" cy="529" r="2.1"/><circle cx="1390" cy="522" r="1.8"/>
    <circle cx="1438" cy="518" r="1.8"/><circle cx="1485" cy="518" r="2"/><circle cx="1532" cy="523" r="1.8"/>
    <circle cx="1580" cy="533" r="2.1"/><circle cx="1628" cy="548" r="1.8"/>
  </g>

  <!-- signal nodes -->
  <g filter="url(#softGlow)">
    <circle class="blue" cx="912" cy="327" r="5.5"/>
    <circle class="blue" cx="1084" cy="424" r="5.5"/>
    <circle class="blue" cx="1035" cy="616" r="5.5"/>
    <circle class="blue" cx="1267" cy="504" r="5.5"/>
    <circle class="blue" cx="1516" cy="460" r="5.5"/>
  </g>
  <g fill="none" stroke="#2f6bff" stroke-opacity=".25">
    <circle cx="912" cy="327" r="16"/><circle cx="1084" cy="424" r="16"/><circle cx="1035" cy="616" r="16"/>
  </g>

  <!-- headline -->
  <g class="hero" fill="#f2f2ee">
    <text x="64" y="438" font-size="76">FROM MANUAL</text>
    <text x="64" y="528" font-size="76">FRICTION</text>
    <text x="1320" y="480" font-size="76" text-anchor="middle">TO OPERATING</text>
    <text x="1320" y="570" font-size="76" text-anchor="middle">SYSTEMS</text>
  </g>

  <!-- footer rule and microcopy -->
  <line x1="64" y1="920" x2="1856" y2="920" stroke="#f2f2ee" stroke-opacity=".15"/>
  <g class="mono" font-size="11" fill="#9da1aa">
    <text x="350" y="960">AUTOMATION / CRM WORKFLOWS / DATA PIPELINES / DASHBOARDS / WEB APPS</text>
    <text x="64" y="960" fill="#f2f2ee">CONTACT US</text>
  </g>
  <g stroke="#f2f2ee" stroke-opacity=".78" fill="none">
    <path d="M64 936h14M64 936v14M196 936h-14M196 936v14M64 986h14M64 986v-14M196 986h-14M196 986v-14"/>
  </g>
</svg>
